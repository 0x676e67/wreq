name: CI

on:
  push:
    tags: ["v*"]
  pull_request:
    paths-ignore:
      - "docs/**"
      - "*.md"
      - ".github/**"
      - "README.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  style:
    name: Style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly
          override: true
          components: rustfmt, clippy
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: Style check
        run: cargo fmt --all -- --check
      - name: Clippy check
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Clippy check (default features)
        run: cargo clippy --all-targets -- -D warnings
      # `--all-features` enables compio-rt, which leaves out the Hickory resolver.
      - name: Clippy check (hickory-dns)
        run: cargo clippy --all-targets --features hickory-dns -- -D warnings

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: Build docs
        run: cargo doc --document-private-items --all-features

  msrv:
    name: MSRV
    needs: [style]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve MSRV aware dependencies
        run: cargo update
        env:
          CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
      - name: Get MSRV package metadata
        id: metadata
        run: cargo metadata --no-deps --format-version 1 | jq -r '"msrv=" + .packages[0].rust_version' >> $GITHUB_OUTPUT
      - name: Install rust (${{ steps.metadata.outputs.msrv }})
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.metadata.outputs.msrv }}
      - uses: Swatinem/rust-cache@v2
      # Include the HTTP/3, Compio and SOCKS code with their pinned git dependencies.
      - name: Check
        run: cargo check --features compio-rt,http3,socks

  test:
    name: Test (${{ matrix.feature-set }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        feature-set:
          - "" # default (tokio-rt)
          - "--no-default-features --features tokio-rt,webpki-roots" # HTTP/1 only
          - "--features compio-rt"
          - "--no-default-features --features compio-rt,webpki-roots" # Compio only
          - "--no-default-features --features compio-rt,webpki-roots,http3" # Compio only with HTTP/3
          - "--features compio-rt,http3"
          - "--features http3"
          - "--no-default-features --features tokio-rt,webpki-roots,http3" # HTTP/3 without HTTP/2
          - "--no-default-features --features webpki-roots,http2,http3,socks" # No built-in runtime
          - "--all-features"
          - "--features form"
          - "--features query"
          - "--features cookies"
          - "--features gzip,stream"
          - "--features brotli,stream"
          - "--features zstd,stream"
          - "--features deflate,stream"
          - "--features json"
          - "--features multipart"
          - "--features stream"
          - "--features socks"
          - "--features hickory-dns"
        # Only these rows run the tests that reach public hosts.
        include:
          - feature-set: ""
            public-network: true
          - feature-set: "--all-features"
            public-network: true
          - feature-set: "--features hickory-dns"
            public-network: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v7
        if: matrix.feature-set == '--all-features'
        with:
          go-version: stable
          cache: false
      - uses: taiki-e/install-action@v2.87.24
        with:
          tool: cargo-nextest
      # Test builds also enable dev-dependency features such as Tokio `net` and QUIC
      # `runtime-tokio`, so lint the library alone to catch a missing cfg or dead code.
      - name: Lint library (${{ matrix.feature-set }})
        run: cargo clippy --lib ${{ matrix.feature-set }} -- -D warnings
      # The emulation tests reach tls.browserleaks.com.
      - name: Run tests (${{ matrix.feature-set }})
        run: cargo nextest run --workspace ${{ matrix.feature-set }} ${{ !matrix.public-network && '-E "not binary_id(wreq::emulate)"' || '' }}
      # nextest does not run doctests.
      - name: Run doctests (${{ matrix.feature-set }})
        if: matrix.feature-set == '' || matrix.feature-set == '--all-features'
        run: cargo test --doc ${{ matrix.feature-set }}

  build:
    name: Build (${{ matrix.env }})
    runs-on: ${{ matrix.os }}
    environment: ${{ matrix.env }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            env: Linux
          - os: windows-latest
            env: Windows
          - os: macos-latest
            env: macOS
          - os: ubuntu-latest
            env: Android
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: Install NASM (Windows)
        if: matrix.os == 'windows-latest'
        run: choco install nasm -y
      - name: Build
        if: matrix.env != 'Android'
        run: cargo build --all-features
      - name: Add Android targets
        if: matrix.env == 'Android'
        run: rustup target add aarch64-linux-android x86_64-linux-android
      - uses: nttld/setup-ndk@v1.6.0
        if: matrix.env == 'Android'
        id: setup-ndk
        with:
          ndk-version: r27c
          add-to-path: true
      - name: Build with cargo-ndk
        if: matrix.env == 'Android'
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cargo install cargo-ndk
          cargo ndk -t arm64-v8a -t x86_64 build --all-features
