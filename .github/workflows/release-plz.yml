name: Release-plz

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/release-plz.yml"

jobs:
  release-plz-readiness:
    name: Release-plz dependency check
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == '0x676e67' }}
    permissions:
      contents: read
    outputs:
      ready: ${{ steps.patches.outputs.ready }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check for temporary dependency patches
        id: patches
        run: |
          python3 - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          manifest = tomllib.loads(Path("Cargo.toml").read_text())
          patches = manifest.get("patch", {}).get("crates-io", {})
          temporary = {"btls", "btls-sys", "tokio-btls", "http2", "netty"}
          active = sorted(
              name
              for name, source in patches.items()
              if name in temporary
              and isinstance(source, dict)
              and ("git" in source or "path" in source)
          )
          if active:
              print("::notice::Release PR generation paused for temporary patches: " + ", ".join(active))
          else:
              print("Release PR generation enabled")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"ready={'false' if active else 'true'}", file=output)
          PY

  release-plz-release:
    name: Release-plz release
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' && github.repository_owner == '0x676e67' }}
    outputs:
      releases_created: ${{ steps.release-plz.outputs.releases_created }}
    permissions:
      contents: write
      # release-plz exchanges this OIDC token for a crates.io publish token.
      id-token: write
    steps:
      - &checkout
        name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}
      - &install-rust
        name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run release-plz
        id: release-plz
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}

  release-plz-pr:
    name: Release-plz PR
    needs: [release-plz-release, release-plz-readiness]
    runs-on: ubuntu-latest
    if: >-
      ${{
        needs.release-plz-readiness.outputs.ready == 'true' &&
        needs.release-plz-release.result == 'success' &&
        needs.release-plz-release.outputs.releases_created == 'false'
      }}
    permissions:
      pull-requests: write
      contents: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - *checkout
      - *install-rust
      - name: Run release-plz
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
