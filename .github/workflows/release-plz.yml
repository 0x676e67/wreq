name: Release-plz

on:
  push:
    branches: ["0.16.x"]
  pull_request:
    branches: ["0.16.x"]
    paths:
      - ".github/workflows/release-plz.yml"

jobs:
  release-plz-release:
    name: Release-plz release
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' && github.repository_owner == '0x676e67' }}
    outputs:
      releases_created: ${{ steps.release-plz.outputs.releases_created }}
    permissions:
      contents: write
      # release-plz exchanges this OIDC token for a crates.io publish token.
      id-token: write
    steps:
      - &checkout
        name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}
      - &install-rust
        name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run release-plz
        id: release-plz
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}

  release-plz-pr:
    name: Release-plz PR
    needs: release-plz-release
    runs-on: ubuntu-latest
    if: >-
      ${{
        github.repository_owner == '0x676e67' &&
        needs.release-plz-release.result == 'success' &&
        needs.release-plz-release.outputs.releases_created == 'false'
      }}
    permissions:
      pull-requests: write
      contents: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - *checkout
      - *install-rust
      - &install-release-pr-tools
        name: Install release-plz and cargo-semver-checks
        uses: taiki-e/install-action@v2.90.6
        with:
          tool: release-plz@0.4.3,cargo-semver-checks@0.51.0
      - &download-baseline
        name: Download the published maintenance version
        id: baseline
        shell: bash
        run: |
          # The latest registry version may belong to a different release series.
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          package="wreq-$version"
          archive="$RUNNER_TEMP/$package.crate"
          curl --fail --silent --show-error --retry 3 \
            "https://static.crates.io/crates/wreq/$package.crate" --output "$archive"
          # Cargo generates this file when it packages a crate.
          tar -xzf "$archive" -C "$RUNNER_TEMP" --exclude "$package/.cargo_vcs_info.json"
          echo "Comparing against published wreq $version"
          echo "manifest=$RUNNER_TEMP/$package/Cargo.toml" >> "$GITHUB_OUTPUT"
      - name: Configure git user from GitHub token
        uses: release-plz/git-config@59144859caf016f8b817a2ac9b051578729173c4
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
      - name: Run release-plz
        env:
          GIT_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          BASELINE_MANIFEST: ${{ steps.baseline.outputs.manifest }}
        run: |
          release-plz release-pr \
            --repo-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --registry-manifest-path "$BASELINE_MANIFEST" \
            -o json

  release-plz-preview:
    name: Release-plz version preview
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - *install-rust
      - *install-release-pr-tools
      - *download-baseline
      - name: Check the proposed maintenance version
        env:
          BASELINE_MANIFEST: ${{ steps.baseline.outputs.manifest }}
        run: |
          release-plz update --registry-manifest-path "$BASELINE_MANIFEST"
          python3 - <<'PY'
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("Cargo.toml").read_text())["package"]["version"]
          print(f"Proposed wreq version: {version}")
          if not version.startswith("0.16."):
              raise SystemExit("The proposed release is outside the 0.16 maintenance series")
          PY
